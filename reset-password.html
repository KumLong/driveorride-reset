<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — DriveOrRide</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #F0F7F5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon {
      width: 64px; height: 64px;
      background: #E6FAF5;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    h1 { color: #013A40; font-size: 20px; margin: 0 0 8px; }
    p { color: #888; font-size: 13px; margin: 0 0 20px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 12px;
      background: #F0F7F5;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #02C39A;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .message { font-size: 13px; margin-top: 14px; }
    .error { color: #e53935; }
    .success { color: #02C39A; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Reset Your Password</h1>
    <p id="subtitle">Enter your new password below.</p>

    <div id="formArea">
      <input type="password" id="newPassword" placeholder="New password (6+ characters)">
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
      <button id="submitBtn" onclick="resetPassword()">Reset Password</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    // ⚠️ Same project URL/key already used in the Flutter app's main.dart.
    const SUPABASE_URL = 'https://ybqbfcpnmxhealnxozip.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JMYUjIJ81VMEeLG3EwmuXA_yFq3X247';

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageEl = document.getElementById('message');
    const subtitleEl = document.getElementById('subtitle');
    const formAreaEl = document.getElementById('formArea');
    const submitBtn = document.getElementById('submitBtn');

    // Supabase's JS client automatically reads the recovery token from
    // the URL (added by the email link) and fires this event once it's
    // confirmed valid — this is what tells us it's safe to show the form.
    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        subtitleEl.textContent = 'Enter your new password below.';
      }
    });

    // If the link was already used, expired, or is invalid, there will
    // be no valid session after a short wait — show an honest error
    // instead of a form that can't actually work.
    setTimeout(async () => {
      const { data } = await client.auth.getSession();
      if (!data.session) {
        formAreaEl.style.display = 'none';
        messageEl.textContent = 'This reset link is invalid or has expired. Please request a new one from the app.';
        messageEl.className = 'message error';
      }
    }, 1500);

    async function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      messageEl.textContent = '';
      messageEl.className = 'message';

      if (newPassword.length < 6) {
        messageEl.textContent = 'Password must be at least 6 characters.';
        messageEl.className = 'message error';
        return;
      }
      if (newPassword !== confirmPassword) {
        messageEl.textContent = 'Passwords do not match.';
        messageEl.className = 'message error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      const { error } = await client.auth.updateUser({ password: newPassword });

      if (error) {
        messageEl.textContent = 'Could not reset password: ' + error.message;
        messageEl.className = 'message error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      } else {
        formAreaEl.style.display = 'none';
        messageEl.textContent = '✓ Password updated! You can now close this page and log in with your new password in the app.';
        messageEl.className = 'message success';
      }
    }
  </script>
</body>
</html>
